name: SMCCA manuscript PDF (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scientific dependencies and historical observation loader
        run: |
          python -m pip install -e .
          python -m pip install statsmodels pandas
      - name: Generate synthetic and observational experiments
        run: |
          python paper/figures/make_figures.py
          python paper/figures/make_extended_figures.py
          python paper/figures/benchmark_orders.py
      - name: Compile SMCCA LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
      - name: Upload reviewed draft PDF
        uses: actions/upload-artifact@v4
        with:
          name: trendestimation-smcca-expanded
          path: paper/main.pdf
          if-no-files-found: error
