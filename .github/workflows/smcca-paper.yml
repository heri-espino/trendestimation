name: SMCCA manuscript PDF (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # This job is manual only. Its Python figure generator now uses
      # af.latex_style() and pdflatex-backed PGF/PDF export, so TeX must be
      # available on the host BEFORE the separate LaTeX compilation action.
      - name: Install LaTeX tools and Latin Modern fonts for exact figure glyphs
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \\
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \\
            texlive-fonts-recommended texlive-pictures lmodern
      - name: Install scientific dependencies and historical observation loader
        run: |
          python -m pip install -e .
          python -m pip install -r paper/requirements.txt
      - name: Generate all required manuscript figures and simulation tables
        run: python paper/build.py --figures
      - name: Compile SMCCA LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
      - name: Upload reviewed draft PDF
        uses: actions/upload-artifact@v4
        with:
          name: trendestimation-smcca-expanded
          path: paper/main.pdf
          if-no-files-found: error
