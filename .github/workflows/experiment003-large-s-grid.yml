name: Experiment003 large-series S-grid archival smoke

on:
  push:
    branches:
      - experiment003/large-series-s-grid-caching
    paths:
      - "paper/benchmarks/experiment003_*.py"
      - "tests/test_experiment003_large_s_grid.py"
      - "notes/experiment003_large_series_s_grid.md"
      - ".github/workflows/experiment003-large-s-grid.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment003-large-s-grid
  cancel-in-progress: true

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RUN_FOLDER: paper/benchmarks/experiment003_large_s_grid/runs/ci-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install library and pinned AwesomeFigures
        run: |
          python -m pip install -e ".[dev,plot]"
          python -m pip install -r paper/requirements.txt
      - name: Lint and numerical smoke regression
        run: |
          python -m ruff check paper/benchmarks/experiment003_large_s_grid.py paper/benchmarks/experiment003_analyze.py tests/test_experiment003_large_s_grid.py
          python -m pytest -q tests/test_experiment003_large_s_grid.py
      - name: Generate one uniquely named CI smoke run from new measurements
        run: |
          export RUN_FOLDER="paper/benchmarks/experiment003_large_s_grid/runs/ci-smoke-$GITHUB_RUN_ID"
          echo "RUN_FOLDER=$RUN_FOLDER" >> "$GITHUB_ENV"
          python paper/benchmarks/experiment003_large_s_grid.py --preset smoke \
            --run-dir "$RUN_FOLDER" --no-publish
      - name: Verify machine data, paper-only plots, and source traceability
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUN_FOLDER"])
          m=json.loads((p/"manifest.json").read_text())
          assert m["complete"] and len(m["files"])>=9
          assert (p/"ANALYSIS.md").exists()
          assert (p/"numerical_validation.csv").exists()
          assert (p/"environment.json").exists()
          assert (p/"scaling_matched_workloads.pdf").stat().st_size>1000
          env=json.loads((p/"environment.json").read_text())
          assert env["preset"]=="smoke"
          assert env["raw_phase_rows"]==16 and env["workflow_rows"]==8
          print("CI smoke is a correctness validation, not a Windows timing claim.")
          PY
      - name: Preserve the reference smoke in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$RUN_FOLDER"
          git commit -m "experiment003: archive Linux CI smoke run $GITHUB_RUN_ID"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: experiment003-linux-smoke
          path: paper/benchmarks/experiment003_large_s_grid/runs/ci-smoke-*
          retention-days: 30
