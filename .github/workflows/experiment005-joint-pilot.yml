name: Experiment005 paired accuracy and runtime pilot

on:
  push:
    branches:
      - experiment005/joint-accuracy-runtime
    paths:
      - .github/workflows/experiment005-joint-pilot.yml
      - paper/benchmarks/experiment005/run_joint.py
      - paper/benchmarks/experiment005/README.md
  workflow_dispatch:

concurrency:
  group: experiment005-joint-pilot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  paired-validity-pilot:
    # Hosted Linux is deliberate; never consume PCAG103A-08 without approval.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numeric dependencies and source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" \
            "mpmath==1.3.0" "threadpoolctl==3.7.0"
          python -m pip install --no-deps -e .
      - name: Smoke check full-S fit and selected-score accuracy together
        shell: bash
        run: |
          set -euo pipefail
          python paper/benchmarks/experiment005/run_joint.py \
            --preset smoke --repeats 3 \
            --out "paper/benchmarks/experiment005/runs/smoke-hosted-$GITHUB_RUN_ID"
      - name: Run first independent joint accuracy/timing pilot
        shell: bash
        run: |
          set -euo pipefail
          OUT="paper/benchmarks/experiment005/runs/pilot-hosted-$GITHUB_RUN_ID"
          echo "EXPERIMENT005_OUTPUT=$OUT" >> "$GITHUB_ENV"
          python paper/benchmarks/experiment005/run_joint.py \
            --preset pilot --repeats 3 --digits 85 --threads 1 --out "$OUT"
          git rev-parse HEAD > "$OUT/input_commit.txt"
          sha256sum paper/benchmarks/experiment005/run_joint.py \
            paper/benchmarks/experiment004/run_pilot.py \
            paper/benchmarks/experiment004/verify_bic_precision.py \
            paper/benchmarks/experiment004/verify_stable_solvers.py \
            paper/benchmarks/full_s_backend_criteria.py \
            src/trendestimation/solvers.py > "$OUT/source_sha256.txt"
      - name: Validate complete data, reference precision and audit record
        shell: bash
        run: |
          set -euo pipefail
          python - "$EXPERIMENT005_OUTPUT" <<'PY'
          import csv,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          meta=json.loads((root/"summary.json").read_text())
          assert meta["experiment"]=="experiment005_joint_accuracy_runtime"
          assert meta["preset"]=="pilot"
          assert meta["d"]==[2,3,5,6]
          assert meta["digits"]==85
          assert meta["reference_rows"]>0
          assert meta["selection_rows"]>0
          for name in ("fit_accuracy_runtime.csv","selection_accuracy_runtime.csv",
                       "setup_and_mapping.csv","reference_checks.csv"):
              assert (root/name).stat().st_size>100
          with (root/"reference_checks.csv").open(newline="") as f:
              ref=list(csv.DictReader(f))
          checked=[float(r["reference_kkt"]) for r in ref
                   if r["reference_kind"]=="85_digit_dual_cholesky"]
          assert checked and max(checked)<=1e-18
          with (root/"fit_accuracy_runtime.csv").open(newline="") as f:
              fits=list(csv.DictReader(f))
          assert {r["method"] for r in fits}=={"svd","eigh","banded_cholesky"}
          assert {int(r["d"]) for r in fits}=={2,3,5,6}
          assert len(fits)==meta["fit_rows"]
          print(json.dumps({
              "fit_rows":meta["fit_rows"],
              "selection_rows":meta["selection_rows"],
              "selection_status_counts":meta["selection_status_counts"],
              "reference_kkt_max":max(checked)
          },indent=2))
          PY
      - name: Upload complete raw data even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment005-joint-accuracy-runtime
          path: paper/benchmarks/experiment005/runs/
          if-no-files-found: warn
      - name: Permanently archive successful pilot on experiment branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --mixed "origin/$GITHUB_REF_NAME"
          git add -f -- "$EXPERIMENT005_OUTPUT"
          git commit -m "experiment005: archive original paired accuracy runtime pilot $GITHUB_RUN_ID [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
