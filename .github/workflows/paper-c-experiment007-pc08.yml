name: Paper C Experiment007 - smoothness precision calibration (PCAG103A-08)

on:
  push:
    branches: [research/paper-c-experiment007-smoothness-precision-calibration]
    paths:
      - .github/workflows/paper-c-experiment007-pc08.yml
      - paper/ngsim-jerk-case-study/experiments/experiment007/*.py
      - paper/ngsim-jerk-case-study/experiments/experiment007/config.json
      - tests/test_paper_c_experiment007.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-c-exp007-windows
  cancel-in-progress: false

jobs:
  independent-simulation:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      CONDA_ENV_DIR: 'C:\Users\175199\AppData\Local\miniconda3\envs\trendestimation'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify runner and create persistent append-only run folder
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw "Wrong machine: $env:RUNNER_NAME" }
          if (!(Test-Path $env:CONDA_EXE)) { throw 'Existing conda executable missing' }
          if (!(Test-Path (Join-Path $env:CONDA_ENV_DIR 'python.exe'))) { throw 'Conda trendestimation env missing' }
          $root = Join-Path $env:USERPROFILE "Documents\TrendEstimation-PaperC\experiment007\run-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw "Refusing to overwrite $root" }
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach($part in @('metadata','logs')) {
            New-Item -ItemType Directory -Path (Join-Path $root $part) | Out-Null
          }
          "EXP007_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$env:GITHUB_SHA" | Out-File (Join-Path $root 'metadata\source_commit.txt') -Encoding ascii
          "$env:RUNNER_NAME" | Out-File (Join-Path $root 'metadata\runner_name.txt') -Encoding ascii
          'New paired factorial simulation; original Experiment004/005/006 data unchanged' |
            Out-File (Join-Path $root 'metadata\data_provenance.txt') -Encoding utf8
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze |
            Out-File (Join-Path $root 'metadata\requirements-resolved.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inventory failed' }
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_paper_c_experiment007.py 2>&1 |
            Tee-Object -FilePath (Join-Path $root 'logs\preflight.log')
          if ($LASTEXITCODE -ne 0) { throw 'Preflight mathematical tests failed' }

      - name: Execute 162 paired pilot trajectories
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/ngsim-jerk-case-study/experiments/experiment007/run.py --stage pilot --output-dir (Join-Path $env:EXP007_ROOT 'pilot') 2>&1 |
            Tee-Object -FilePath (Join-Path $env:EXP007_ROOT 'logs\pilot.log')
          if ($LASTEXITCODE -ne 0) { throw 'Experiment007 pilot failed; inspect persistent VM logs' }
          $m = Get-Content (Join-Path $env:EXP007_ROOT 'pilot\run_manifest.json') -Raw | ConvertFrom-Json
          if ($m.n_trials -ne 162 -or $m.n_selection_rows -ne 648 -or $m.status -ne 'complete') {
            throw 'Pilot missing trials or contains failed methods'
          }

      - name: Execute 1944 independent-seed paired confirmation trajectories
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/ngsim-jerk-case-study/experiments/experiment007/run.py --stage confirm --output-dir (Join-Path $env:EXP007_ROOT 'confirm') 2>&1 |
            Tee-Object -FilePath (Join-Path $env:EXP007_ROOT 'logs\confirm.log')
          if ($LASTEXITCODE -ne 0) { throw 'Experiment007 confirmation failed' }
          $m = Get-Content (Join-Path $env:EXP007_ROOT 'confirm\run_manifest.json') -Raw | ConvertFrom-Json
          if ($m.n_trials -ne 1944 -or $m.n_selection_rows -ne 7776 -or $m.n_independent_replicate_parent_draws -ne 72 -or $m.status -ne 'complete') {
            throw 'Confirmation case coverage, inference groups or finite selections failed'
          }

      - name: Always archive directory paths and hashes including partial failures
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:EXP007_ROOT
          if (!$root) {
            $root=Join-Path $env:USERPROFILE "Documents\TrendEstimation-PaperC\experiment007\run-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          }
          if (!(Test-Path $root)) { New-Item -ItemType Directory -Force -Path $root | Out-Null }
          $status='partial_or_failed'
          if (Test-Path (Join-Path $root 'pilot\run_manifest.json')) { $status='pilot_complete' }
          if (Test-Path (Join-Path $root 'confirm\run_manifest.json')) { $status='pilot_and_confirm_complete' }
          & (Join-Path $env:CONDA_ENV_DIR 'python.exe') paper/ngsim-jerk-case-study/experiments/experiment004/inventory.py --run-root $root --status $status --output (Join-Path $root 'metadata\file_inventory.json')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to record exact Windows run file paths' }

      - name: Mirror all generated source-truth/noisy trajectories and output into Git checkout
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:EXP007_ROOT
          if (!$root) {
            $root=Join-Path $env:USERPROFILE "Documents\TrendEstimation-PaperC\experiment007\run-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          }
          $rel="paper/ngsim-jerk-case-study/experiments/experiment007/runs/pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $dest=Join-Path $env:GITHUB_WORKSPACE $rel
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -LiteralPath $root -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $dest -Recurse -Force
          }
          "$root" | Out-File (Join-Path $dest 'vm_run_root.txt') -Encoding utf8

      - name: Upload complete VM results for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-c-exp007-pc08-calibration
          path: paper/ngsim-jerk-case-study/experiments/experiment007/runs/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit every new first-party result to immutable isolated Git results branch
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $rel="paper/ngsim-jerk-case-study/experiments/experiment007/runs/pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          if (!(Test-Path (Join-Path $rel 'metadata\file_inventory.json'))) { throw 'Missing file inventory' }
          $archive="results/paper-c-exp007-pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create immutable results-only branch' }
          git add -f -- $rel
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage complete experiment output' }
          git commit -m "experiment007: preserve all paired S calibration data and VM file hashes $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit complete source-derived results' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push complete results archive' }
          Write-Host "Full saved VM and Git result directory at $archive"
