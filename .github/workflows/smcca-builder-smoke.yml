name: Springer Computational Statistics paper smoke checks
on:
  pull_request:
    paths:
      - 'paper/build.py'
      - 'paper/main.tex'
      - 'paper/sn-jnl.cls'
      - 'paper/sn-mathphys-ay.bst'
      - 'paper/package_submission.py'
      - 'paper/bibliografia.bib'
      - 'paper/figures/render_awesomefigures.py'
      - 'paper/requirements.txt'
      - 'paper/tests/**'
      - 'paper/Makefile'
      - 'paper/README.md'
      - '.github/workflows/smcca-builder-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned GitHub AwesomeFigures for vector PDF tests
        run: python -m pip install -r paper/requirements.txt
      - name: Unit-test paper builder and tiny vector-PDF exports
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s paper/tests -p 'test_*.py' -v
      - name: Validate all builder flag combinations without side effects
        run: |
          python paper/build.py --help
          python paper/build.py --dry-run
          python paper/build.py --dry-run --all --benchmark-preset full --repeats 7
          python paper/build.py --dry-run --tables
          python paper/build.py --dry-run --pdf --package
          python paper/build.py --dry-run --clean
