name: AwesomeFigures MLE and computational manuscript vectors

on:
  push:
    branches: [research/mle-coordinate-awesomefigures-figures]
    paths:
      - 'paper/benchmarks/selection_coordinate_mle.py'
      - 'paper/figures/render_mle_benchmarks.py'
      - 'paper/figures/render_awesomefigures.py'
      - '.github/workflows/mle-awesomefigures.yml'
      - 'tests/test_selection_coordinate_mle_figures.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paper-compatible LaTeX typography
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern latexmk
      - name: Install scientific dependencies and pinned AwesomeFigures
        run: |
          python -m pip install -e '.[dev,docs,plot]'
          python -m pip install -r paper/requirements.txt
      - name: Test mapped MLE and classical criterion scores
        run: |
          python -m pytest -q tests/test_selection_coordinate_mle_figures.py tests/test_docs_coordinate_full_range.py
          python -m unittest discover -s paper/tests -v
      - name: Collect measured MLE versus S/lambda selection
        run: |
          python paper/benchmarks/selection_coordinate_mle.py --preset quick --repeats 7 --threads 1 --output-dir paper/benchmarks/selection_coordinate_reference
      - name: Render AwesomeFigures PDFs and SVGs
        run: |
          python paper/build.py --figures
          python paper/figures/render_awesomefigures.py --benchmarks-only
      - name: Verify actual measured data and four vector pairs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          folder=Path('paper/benchmarks/selection_coordinate_reference')
          with (folder/'selector_timings.csv').open(newline='') as stream:
              rows=list(csv.DictReader(stream))
          with (folder/'criterion_score_paths.csv').open(newline='') as stream:
              paths=list(csv.DictReader(stream))
          env=json.loads((folder/'environment.json').read_text())
          assert {r['criterion'] for r in rows}=={'cv','gcv','aicc','bic','mle'}
          assert {r['policy'] for r in rows}=={'matched_lambda','native_s','log_lambda'}
          assert {float(r['mu']) for r in rows}=={0,.15}
          assert {int(r['d']) for r in rows}=={2,4}
          assert all(float(r['selection_median_s'])>0 for r in rows)
          assert any(r['criterion']=='mle' and r['finite']=='False'
                     and float(r['lambda'])==0 for r in paths)
          assert env['blas_threads']==1
          stems=('gcv_solver_by_order','gcv_repeated_search',
                 'criteria_with_mle_s_paths','criteria_with_mle_search_time')
          for name in stems:
              pdf=Path('paper/figures')/(name+'.pdf')
              svg=Path('paper/figures')/(name+'.svg')
              assert pdf.read_bytes().startswith(b'%PDF-')
              assert pdf.stat().st_size>1000
              assert '<svg' in svg.read_text()
          print('Verified four real PDF/SVG figure pairs')
          PY
      - name: Build strict website
        env:
          TRENDESTIMATION_DOCS_EXECUTION: 'off'
        run: python -m sphinx -W --keep-going -b html docs build/site
      - name: Build manuscript PDF and flat submission ZIP
        run: python paper/build.py --pdf --package
      - name: Commit measured data and artwork on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/benchmarks/selection_coordinate_reference/*.csv
          git add -f paper/benchmarks/selection_coordinate_reference/environment.json
          for stem in gcv_solver_by_order gcv_repeated_search criteria_with_mle_s_paths criteria_with_mle_search_time; do
            git add -f "paper/figures/$stem.pdf" "paper/figures/$stem.svg"
          done
          if git diff --cached --quiet; then
            echo "No new measurements/figures"
          else
            git commit -m "results: archive measured MLE S/lambda benchmark and four AwesomeFigures PDF/SVG pairs"
            git push origin HEAD:research/mle-coordinate-awesomefigures-figures
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: awesomefigures-mle-paper
          path: |
            paper/figures/gcv_solver_by_order.pdf
            paper/figures/gcv_solver_by_order.svg
            paper/figures/gcv_repeated_search.pdf
            paper/figures/gcv_repeated_search.svg
            paper/figures/criteria_with_mle_s_paths.pdf
            paper/figures/criteria_with_mle_s_paths.svg
            paper/figures/criteria_with_mle_search_time.pdf
            paper/figures/criteria_with_mle_search_time.svg
            paper/benchmarks/selection_coordinate_reference/
            paper/main.pdf
            paper/computational-statistics-submission.zip
          retention-days: 30
