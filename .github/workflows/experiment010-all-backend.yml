name: Experiment010 all-backend S-indexed timing verification (Windows)

on:
  push:
    branches: [research/experiment010-multibackend-frontier-design]
    paths:
      - .github/workflows/experiment010-all-backend.yml
      - paper/benchmarks/experiment010/**
      - paper/benchmarks/experiment006/run.py
      - tests/test_experiment010_runner.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment010-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-measurements:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        phase: [smoke, pilot]
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      PYTHONPATH: ${{ github.workspace }}\src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact benchmark source
        uses: actions/checkout@v4
      - name: Verify correct Windows VM and existing Conda
        run: |
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong university runner; cannot pool timings' }
          if (!(Test-Path -LiteralPath $env:CONDA_EXE)) { throw 'Existing Conda executable missing' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -c "import numpy,scipy,threadpoolctl; print('Existing environment confirmed')"
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies missing; no installation performed' }
      - name: Run numerical prerequisite and Experiment010 contract tests
        run: |
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_experiment010_runner.py tests/test_experiment006_bench.py tests/test_experiment006_hybrid_criteria.py tests/test_experiment006_selected_inverse.py
          if ($LASTEXITCODE -ne 0) { throw 'Numerical prerequisite tests failed; benchmark not executed' }
      - name: Run bounded real all-method timings with the three mean policies
        run: |
          $phase = '${{ matrix.phase }}'
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $dest = "paper/benchmarks/experiment010/runs/windows-$id-$phase"
          if ($phase -eq 'smoke') {
            $seconds = 600; $attempts = 30
          } else {
            $seconds = 900; $attempts = 60
          }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment010/run_batches.py --preset $phase --repeats 2 --series-count 2 --max-work 80000000 --max-seconds $seconds --per-method-seconds 55 --max-method-attempts $attempts --start-attempt 0 --output $dest
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark runner returned error; partial evidence preserved if present' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze | Out-File -FilePath "$dest/requirements-resolved.txt" -Encoding utf8
          Get-Content "$dest/batch_summary.json"
      - name: Upload full manifest, real timing CSVs and failure ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment010-${{ matrix.phase }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: paper/benchmarks/experiment010/runs/windows-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.phase }}/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit every measured output to an immutable results branch
        if: always()
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $dir = "paper/benchmarks/experiment010/runs/windows-$id-${{ matrix.phase }}"
          if (!(Test-Path -LiteralPath "$dir/run_metadata.json")) {
            Write-Host 'No measurements or manifest were created'
            exit 0
          }
          $archive = "results/experiment010-$id-${{ matrix.phase }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cannot start immutable results branch' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage raw results' }
          git commit -m "experiment010: archive ${{ matrix.phase }} full-criterion timing evidence $id"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit experiment' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot persist results to GitHub' }
          Write-Host "Preserved Experiment010 data on $archive"
