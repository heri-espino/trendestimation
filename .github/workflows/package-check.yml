name: Validate package and documentation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and docs dependencies
        run: python -m pip install -e '.[dev,docs,plot]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload distributions for inspection (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: trendestimation-distributions
          path: dist/*
          if-no-files-found: error
