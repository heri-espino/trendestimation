name: Sphinx docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    name: Validate docs (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and docs dependencies
        run: python -m pip install -e ".[docs]"
      - name: Check Sphinx HTML and references
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
