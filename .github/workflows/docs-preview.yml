name: Sphinx docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    name: Validate docs (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and docs dependencies
        run: python -m pip install -e ".[docs]"
      - name: Check Sphinx HTML and references without re-executing notebooks
        env:
          TRENDESTIMATION_DOCS_EXECUTION: "off"
        run: python -m sphinx -W --keep-going -b html docs build/site
      - name: Upload rendered HTML preview (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: trendestimation-sphinx-preview
          path: build/site
          retention-days: 7
