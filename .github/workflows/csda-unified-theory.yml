name: Unified CSDA theory — verify and compile Elsevier CAS

on:
  push:
    branches:
      - paper/csda-unified-theory
      - paper/csda-algorithm-provenance
      - paper/csda-landscape-tables-svd-20261118
      - paper/csda-weinert-d3-svd-comparison
      - paper/csda-reml-theorem-explanations-20261119
      - paper/csda-awesomefigures-gaussian-jerk-demo
      - paper/csda-contributions-precision-likelihood-20261123
      - editorial/csda-state-of-art-positioning-20261123
      - editorial/csda-authors-font-equations-20261124
    paths:
      - ".github/workflows/csda-unified-theory.yml"
      - "paper/csda-unified-theory/main.tex"
      - "paper/csda-unified-theory/rotate_landscape_tables.py"
      - "paper/csda-unified-theory/algorithmic_references.bib"
      - "paper/csda-unified-theory/COMPLEXITY_REFERENCE_LEDGER.md"
      - "paper/csda-unified-theory/sections/**"
      - "paper/csda-unified-theory/figures/*.py"
      - "paper/csda-unified-theory/figures/README.md"
      - "paper/requirements.txt"
      - "paper/csda-unified-theory/verify_theory.py"
      - "paper/csda-unified-theory/verify_layout.py"
      - "paper/csda-unified-theory/tests/**"
      - "paper/csda-unified-theory/notes/WEINERT_PRIMARY_SOURCE_D3_REVIEW.md"
      - "paper/csda-unified-theory/notes/GAUSSIAN_LIKELIHOOD_PROVENANCE.md"
      - "paper/csda-unified-theory/notes/PRIMARY_REFERENCE_AUDIT_20261119.md"
      - "paper/csda-unified-theory/notes/CONTRIBUTION_PRIORITY_AUDIT_20261123.md"
      - "paper/csda-unified-theory/notes/SUBMISSION_LAYOUT_AND_DECLARATIONS_20261123.md"
      - "paper/csda-unified-theory/README.md"
      - "paper/csda-unified-theory/AGENTS.md"
      - "paper/csda-unified-theory/SCOPE_AND_PROOF_AUDIT.md"
      - "paper/csda-computational-costs/references.bib"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csda-unified-theory-charis-stix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic mathematical checks only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy scipy
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python paper/csda-unified-theory/verify_theory.py
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python paper/csda-computational-costs/verify_theory.py
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m unittest discover -s paper/csda-unified-theory/tests -p 'test_*.py' -v
          test -s paper/csda-computational-costs/references.bib
          test -s paper/csda-unified-theory/algorithmic_references.bib
      - name: Render the single synthetic example with pinned AwesomeFigures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . matplotlib
          python -m pip install "$(grep '^awesomefigures @ ' paper/requirements.txt)"
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python paper/csda-unified-theory/figures/render_gaussian_jerk.py
          for name in gaussian_jerk_demo.pdf gaussian_jerk_demo.png gaussian_jerk_demo.svg gaussian_jerk_demo.json gaussian_jerk_series.csv gaussian_jerk_profile.csv; do
            test -s "paper/csda-unified-theory/figures/$name"
          done
      - name: Install exact Elsevier CAS compatible TeX toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-pictures lmodern latexmk poppler-utils
          # CAS v2.4 uses Charis text and STIX mathematics when both exist;
          # this prevents its Computer Modern fallback used in the prior PDF.
          kpsewhich charis.sty
          kpsewhich stix.sty
          kpsewhich inconsolata.sty
          for f in cas-dc.cls cas-common.sty cas-model2-names.bst; do
            test -s "paper/els-cas-templates/$f"
            cp "paper/els-cas-templates/$f" "paper/csda-unified-theory/$f"
          done
      - name: Compile and verify journal manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd paper/csda-unified-theory
          latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error main.tex
          python -m pip install --disable-pip-version-check pypdf==5.9.0
          python rotate_landscape_tables.py main.pdf
          python rotate_landscape_tables.py main.pdf --check
          python verify_layout.py main.log
          test -s main.pdf
          test -s main.log
          pdfinfo main.pdf | head -20
          if grep -Eq "Citation .* undefined|There were undefined references" main.log; then
            echo "Unresolved references or citations in final PDF"
            exit 1
          fi
          if grep -Eq "LaTeX Error|Fatal error occurred" main.log; then
            echo "LaTeX error in manuscript"
            exit 1
          fi
          sha256sum main.tex algorithmic_references.bib sections/*.tex figures/render_gaussian_jerk.py figures/README.md figures/gaussian_jerk_demo.pdf figures/gaussian_jerk_demo.png figures/gaussian_jerk_demo.svg figures/gaussian_jerk_demo.json figures/gaussian_jerk_series.csv figures/gaussian_jerk_profile.csv tests/test_*.py notes/WEINERT_PRIMARY_SOURCE_D3_REVIEW.md notes/GAUSSIAN_LIKELIHOOD_PROVENANCE.md notes/PRIMARY_REFERENCE_AUDIT_20261119.md notes/CONTRIBUTION_PRIORITY_AUDIT_20261123.md notes/STATE_OF_ART_POSITIONING_20261123.md notes/SUBMISSION_LAYOUT_AND_DECLARATIONS_20261123.md verify_theory.py verify_layout.py rotate_landscape_tables.py README.md \
            AGENTS.md SCOPE_AND_PROOF_AUDIT.md COMPLEXITY_REFERENCE_LEDGER.md \
            ../csda-computational-costs/references.bib \
            ../els-cas-templates/cas-dc.cls \
            ../els-cas-templates/cas-common.sty \
            ../els-cas-templates/cas-model2-names.bst main.pdf main.log \
            > unified_source_sha256.txt
          git rev-parse HEAD > unified_source_commit.txt
      - name: Upload compiled paper, source and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csda-unified-theory-build
          path: |
            paper/csda-unified-theory/main.tex
            paper/csda-unified-theory/rotate_landscape_tables.py
            paper/csda-unified-theory/verify_layout.py
            paper/csda-unified-theory/algorithmic_references.bib
            paper/csda-unified-theory/COMPLEXITY_REFERENCE_LEDGER.md
            paper/csda-unified-theory/sections/
            paper/csda-unified-theory/figures/
            paper/csda-unified-theory/README.md
            paper/csda-unified-theory/AGENTS.md
            paper/csda-unified-theory/notes/STATE_OF_ART_POSITIONING_20261123.md
            paper/csda-unified-theory/notes/SUBMISSION_LAYOUT_AND_DECLARATIONS_20261123.md
            paper/csda-unified-theory/SCOPE_AND_PROOF_AUDIT.md
            paper/csda-unified-theory/verify_theory.py
            paper/csda-unified-theory/tests/
            paper/csda-unified-theory/notes/WEINERT_PRIMARY_SOURCE_D3_REVIEW.md
            paper/csda-unified-theory/notes/GAUSSIAN_LIKELIHOOD_PROVENANCE.md
            paper/csda-unified-theory/notes/PRIMARY_REFERENCE_AUDIT_20261119.md
            paper/csda-unified-theory/notes/CONTRIBUTION_PRIORITY_AUDIT_20261123.md
            paper/csda-unified-theory/main.pdf
            paper/csda-unified-theory/main.log
            paper/csda-unified-theory/unified_source_sha256.txt
            paper/csda-unified-theory/unified_source_commit.txt
          if-no-files-found: warn
          retention-days: 60
      - name: Commit verified PDF and provenance to isolated paper branch
        if: success() && (github.ref == 'refs/heads/paper/csda-unified-theory' || github.ref == 'refs/heads/paper/csda-algorithm-provenance' || github.ref == 'refs/heads/paper/csda-landscape-tables-svd-20261118' || github.ref == 'refs/heads/paper/csda-weinert-d3-svd-comparison' || github.ref == 'refs/heads/paper/csda-reml-theorem-explanations-20261119' || github.ref == 'refs/heads/paper/csda-awesomefigures-gaussian-jerk-demo' || github.ref == 'refs/heads/paper/csda-contributions-precision-likelihood-20261123' || github.ref == 'refs/heads/editorial/csda-state-of-art-positioning-20261123')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/csda-unified-theory/main.pdf \
            paper/csda-unified-theory/figures/gaussian_jerk_demo.pdf \
            paper/csda-unified-theory/figures/gaussian_jerk_demo.png \
            paper/csda-unified-theory/figures/gaussian_jerk_demo.svg \
            paper/csda-unified-theory/figures/gaussian_jerk_demo.json \
            paper/csda-unified-theory/figures/gaussian_jerk_series.csv \
            paper/csda-unified-theory/figures/gaussian_jerk_profile.csv \
            paper/csda-unified-theory/main.log \
            paper/csda-unified-theory/unified_source_sha256.txt \
            paper/csda-unified-theory/unified_source_commit.txt
          if ! git diff --cached --quiet; then
            git commit -m "paper: archive compiled unified CSDA theory and source provenance [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
              echo "Concurrent paper changes detected; refuse overwrite"
              exit 1
            fi
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
