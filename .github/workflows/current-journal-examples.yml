name: Rebuild contemporary journal examples

on:
  push:
    branches:
      - paper/current-data-multiorder-extrapolation-20261026
    paths:
      - "paper/computational-statistics-submission/**"
      - "tests/test_current_study_examples.py"
      - ".github/workflows/current-journal-examples.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-current-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-examples:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific package and rendering utilities
        run: |
          python -m pip install -e ".[plot]"
          python -m pip install pytest
      - name: Retrieve, pin and validate FRED vintage; generate all figures
        run: |
          python paper/computational-statistics-submission/make_current_examples.py --fetch-fred
      - name: Regenerate older synthetic criterion table for standalone manuscript
        run: |
          python paper/figures/make_figures.py
          cp paper/criteria_table.tex paper/computational-statistics-submission/criteria_table.tex
      - name: Scientific and source regression tests
        run: |
          python -m pytest -q tests/test_current_study_examples.py
      - name: Compile independent Springer submission
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/computational-statistics-submission
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Commit dated snapshots, vector figures, tables and compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/computational-statistics-submission/data/
          git add -f paper/computational-statistics-submission/figures/
          git add -f paper/computational-statistics-submission/current_examples_table.tex
          git add -f paper/computational-statistics-submission/criteria_table.tex
          git add -f paper/computational-statistics-submission/main.pdf
          if git diff --cached --quiet; then
            echo "Identical frozen figures and data already committed."
          else
            git commit -m "paper(data): freeze Sep 2026 CO2 and unemployment examples with rendered vector plots"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: contemporary-computational-statistics-${{ github.run_id }}
          path: |
            paper/computational-statistics-submission/data/
            paper/computational-statistics-submission/figures/
            paper/computational-statistics-submission/current_examples_table.tex
            paper/computational-statistics-submission/main.pdf
          retention-days: 30
          if-no-files-found: error
