name: Experiment010 higher-n matched solver frontier (Windows)

on:
  push:
    branches: [research/experiment010-multibackend-frontier-design]
    paths:
      - .github/workflows/experiment010-frontier.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment010-higher-n-frontier
  cancel-in-progress: false

jobs:
  paired-timings:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        start: [0, 60]
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      PYTHONPATH: ${{ github.workspace }}\src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Check existing university Windows Conda and numerical contracts
        run: |
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong runner' }
          if (!(Test-Path -LiteralPath $env:CONDA_EXE)) { throw 'Pre-existing Conda not found' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_experiment010_runner.py tests/test_experiment010_mle_normalization.py tests/test_experiment006_hybrid_criteria.py tests/test_experiment006_selected_inverse.py
          if ($LASTEXITCODE -ne 0) { throw 'Numerical prerequisites failed; benchmark not started' }
      - name: Run all 10 methods and 3 mean policies at n256/n512
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $offset = '${{ matrix.start }}'
          $dest = "paper/benchmarks/experiment010/runs/windows-$id-frontier-offset$offset"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment010/run_batches.py --preset frontier --start-attempt $offset --repeats 2 --series-count 2 --max-work 80000000 --max-seconds 600 --per-method-seconds 55 --max-method-attempts 60 --output $dest
          if ($LASTEXITCODE -ne 0) { throw 'Experiment runner failed; preserve any partial output' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze | Out-File -FilePath "$dest/requirements-resolved.txt" -Encoding utf8
          Get-Content "$dest/batch_summary.json"
      - name: Upload original raw time CSV and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment010-frontier-offset${{ matrix.start }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: paper/benchmarks/experiment010/runs/windows-${{ github.run_id }}-a${{ github.run_attempt }}-frontier-offset${{ matrix.start }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Permanently preserve original timing records in GitHub
        if: always()
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $offset = '${{ matrix.start }}'
          $dir = "paper/benchmarks/experiment010/runs/windows-$id-frontier-offset$offset"
          if (!(Test-Path -LiteralPath "$dir/run_metadata.json")) { exit 0 }
          $archive = "results/experiment010-$id-frontier-offset$offset"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Result branch creation failed' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Result staging failed' }
          git commit -m "experiment010: archive n256/n512 solver frontier offset$offset ($id)"
          if ($LASTEXITCODE -ne 0) { throw 'Result commit failed' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Results not safely archived' }
          Write-Host "All benchmark outcomes preserved on $archive"
