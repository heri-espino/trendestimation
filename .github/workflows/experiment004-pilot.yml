name: Experiment004 RMSE pilot (small, hosted)

on:
  push:
    branches:
      - research/experiment004-s-accuracy-computation
    paths:
      - .github/workflows/experiment004-pilot.yml
      - paper/benchmarks/experiment004/run_pilot.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    # Intentionally NOT the PCAG103A-08 self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install numerical dependencies
        run: python -m pip install "numpy==2.3.5" "scipy==1.17.0" "threadpoolctl>=3"
      - name: Run 20-seed RMSE and numerical QA pilot
        shell: bash
        run: |
          set -euo pipefail
          OUT="paper/benchmarks/experiment004/runs/pilot-hosted-$GITHUB_RUN_ID"
          echo "EXPERIMENT004_OUT=$OUT" >> "$GITHUB_ENV"
          python paper/benchmarks/experiment004/run_pilot.py --seeds 20 --out "$OUT"
          sha256sum paper/benchmarks/experiment004/run_pilot.py > "$OUT/source_sha256.txt"
          git rev-parse HEAD > "$OUT/input_commit.txt"
          python - "$OUT" <<'PY'
          import csv, json, pathlib, sys
          folder=pathlib.Path(sys.argv[1])
          with (folder/"pilot_rmse.csv").open(newline="") as handle:
              rows=list(csv.DictReader(handle))
          with (folder/"numerical_qa.csv").open(newline="") as handle:
              qa=list(csv.DictReader(handle))
          assert len(rows)==9600,(len(rows),"expected 9600 RMSE rows")
          assert len(qa)==192,(len(qa),"expected 192 QA rows")
          assert {int(x["d"]) for x in rows}=={1,2,3,4,5,6}
          metadata=json.loads((folder/"environment.json").read_text())
          assert metadata["grid_size"]==110
          print("Verified hosted pilot:",len(rows),"RMSE rows,",len(qa),"QA rows")
          print("Numerical QA categories:",metadata["qa_status_counts"])
          PY
      - name: Upload complete immutable run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment004-pilot
          path: paper/benchmarks/experiment004/runs/
          if-no-files-found: warn
      - name: Preserve raw results on research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$EXPERIMENT004_OUT"
          git commit -m "experiment004: archive hosted RMSE pilot $GITHUB_RUN_ID [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
