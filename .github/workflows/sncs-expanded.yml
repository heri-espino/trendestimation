name: Expanded SNCS manuscript from archived numerical results

on:
  push:
    branches:
      - paper/sncs-expanded-methods-results
    paths:
      - "paper/computational-statistics-submission/sncs_*"
      - "tests/test_sncs_expanded_results.py"
      - ".github/workflows/sncs-expanded.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sncs-expanded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical library and plotting dependencies only
        run: |
          python -m pip install -e ".[dev,plot]"
          python -m pip install -r paper/requirements.txt
      - name: Check saved matched-grid selection parity; render figures/tables only
        run: |
          python -m pytest -q tests/test_sncs_expanded_results.py
          python paper/computational-statistics-submission/sncs_expand_results.py
      - name: Compile expanded Springer manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/computational-statistics-submission
          root_file: sncs_main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Ensure compiled PDF and archived results are intact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("paper/computational-statistics-submission")
          files=[p/"sncs_main.pdf",p/"figures/sncs_observed_trends.pdf",
                 p/"figures/sncs_orders_trends.pdf",
                 p/"figures/sncs_smoothness_mapping.pdf",
                 p/"figures/sncs_coordinate_methods.pdf",
                 p/"sncs_realdata_table.tex",
                 p/"sncs_coordinate_methods_table.tex",
                 p/"sncs_solver_orders_table.tex"]
          for f in files:
              assert f.exists() and f.stat().st_size>100, str(f)
          manifest=json.loads((p/"sncs_expanded_render_manifest.json").read_text())
          assert manifest["unchanged"] and len(manifest["figures"])==12
          print("Archived numerical sources unchanged; rendered",len(manifest["figures"]),"figure files")
          PY
      - name: Commit figures and paper to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/computational-statistics-submission/sncs_*table.tex
          git add -f paper/computational-statistics-submission/figures/sncs_observed_trends.*
          git add -f paper/computational-statistics-submission/figures/sncs_orders_trends.*
          git add -f paper/computational-statistics-submission/figures/sncs_smoothness_mapping.*
          git add -f paper/computational-statistics-submission/figures/sncs_coordinate_methods.*
          git add -f paper/computational-statistics-submission/sncs_expanded_render_manifest.json
          git add -f paper/computational-statistics-submission/sncs_main.pdf
          if git diff --cached --quiet; then
            echo "No changes in render-only output."
          else
            git commit -m "paper: archive expanded SNCS manuscript tables and figures from preserved results"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-sncs-article-${{ github.run_id }}
          path: |
            paper/computational-statistics-submission/sncs_main.pdf
            paper/computational-statistics-submission/figures/sncs_*.pdf
            paper/computational-statistics-submission/sncs_*table.tex
            paper/computational-statistics-submission/sncs_expanded_render_manifest.json
          retention-days: 30
