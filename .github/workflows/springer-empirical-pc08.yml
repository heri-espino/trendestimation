name: Experiment011 Springer empirical PC08 audit and publication

on:
  push:
    branches:
      - paper/springer-empirical-tensor-pc08
  workflow_dispatch:
    inputs:
      stage:
        description: 'Read-only preflight'
        required: true
        type: choice
        options:
          - preflight
        default: preflight

permissions:
  contents: write
  actions: read

concurrency:
  group: experiment011-springer-empirical-pc08
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pc08-preflight]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      ORIGINAL: 'C:\Users\175199\trendestimation-PC08_add97svd_20261105_025108'
      BACKUP: 'C:\Users\175199\experiment011-backups\experiment011_20261109_072910742'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Require intended PC08 runner
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME, USERNAME=$env:USERNAME"
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw "Wrong runner, expected PCAG103A-08" }
          if (-not (Test-Path -LiteralPath $env:CONDA_EXE)) { throw "Conda inaccessible" }
      - name: Inspect complete report and its local backup (no benchmark execution)
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "paper/benchmarks/experiment011/pc08_empirical/outputs/preflight-${{ github.run_id }}.json"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment011/pc08_empirical/preflight.py --root $env:ORIGINAL --backup $env:BACKUP --output $out
          if ($LASTEXITCODE -ne 0) { throw "Read-only preflight failed; output retained where possible" }
      - name: Upload compact diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment011-pc08-preflight-${{ github.run_id }}
          path: paper/benchmarks/experiment011/pc08_empirical/outputs/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve metadata on a separate permanent branch
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "paper/benchmarks/experiment011/pc08_empirical/outputs/preflight-${{ github.run_id }}.json"
          if (-not (Test-Path -LiteralPath $out)) {
            Write-Host "No diagnostic generated: do not publish an empty evidence claim."
            exit 0
          }
          $branch = "results/experiment011-pc08-preflight-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c $branch
          if ($LASTEXITCODE -ne 0) { throw "Cannot create diagnostic archive branch" }
          git add -f -- $out
          git commit -m "experiment011: archive read-only PC08 preflight"
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic commit failed" }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic publication failed" }


  analyze:
    if: contains(github.event.head_commit.message, '[pc08-analyze]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      ORIGINAL: 'C:\Users\175199\trendestimation-PC08_add97svd_20261105_025108'
      BACKUP: 'C:\Users\175199\experiment011-backups\experiment011_20261109_072910742'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Restrict to PC08 and test Python parser without running benchmarks
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw "Wrong runner" }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m py_compile paper/benchmarks/experiment011/pc08_empirical/analyze_campaign.py
          if ($LASTEXITCODE -ne 0) { throw "Analyzer failed to compile" }
      - name: Reconstruct source lineage and derive sparse measured tensor
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "paper/benchmarks/experiment011/pc08_empirical/derived/${{ github.run_id }}"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment011/pc08_empirical/analyze_campaign.py --original $env:ORIGINAL --backup $env:BACKUP --out $out
          if ($LASTEXITCODE -ne 0) { throw "Analysis audit failed, inspect traceback; no benchmarks are permitted" }
          $summary = Get-Content -LiteralPath (Join-Path $out 'analysis_summary.json') -Raw | ConvertFrom-Json
          if ($summary.recorded_jobs -ne 2813) { throw "Unexpected campaign cardinality" }
          Write-Host "Data-based complete timing rows: $($summary.valid_complete_rows)/$($summary.tensor_rows)"
      - name: Upload all compact derived evidence as extra copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment011-springer-analysis-${{ github.run_id }}
          path: paper/benchmarks/experiment011/pc08_empirical/derived/${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve derived code/data/figures in source branch and immutable results branch
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw "Wrong runner" }
          $out = "paper/benchmarks/experiment011/pc08_empirical/derived/${{ github.run_id }}"
          if (-not (Test-Path -LiteralPath (Join-Path $out 'analysis_summary.json'))) {
            throw 'Refuse to publish nonexistent analysis.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $out
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage derived files' }
          git commit -m 'experiment011: archive lineage-audited timing tensor and figures'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit derived files' }
          git push origin HEAD:refs/heads/paper/springer-empirical-tensor-pc08
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish on scoped analysis branch' }
          $result = "results/experiment011-springer-derived-${{ github.run_id }}"
          git switch -c $result
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create immutable result ref' }
          git push origin "HEAD:refs/heads/$result"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish immutable result ref' }


  build:
    if: contains(github.event.head_commit.message, '[pc08-build]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify expected runner, frozen figure inputs and ingestion unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong runner' }
          $data = 'paper/benchmarks/experiment011/pc08_empirical/derived/42634293076'
          foreach ($file in @('analysis_summary.json','empirical_results.tex','claim_to_data_ledger.json',
            'figures/fig01_reliability.pdf','figures/fig02_paired_cv_gcv.pdf',
            'figures/fig03_mapping_cost.pdf','figures/fig04_workloads.pdf')) {
            if (-not (Test-Path -LiteralPath (Join-Path $data $file))) { throw "Missing frozen empirical input $file" }
          }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m unittest discover -s paper/benchmarks/experiment011/pc08_empirical -p test_*.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-only tests failed' }
      - name: Fresh Springer sn-jnl compile with existing reproducible builder
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "paper/builds/pc08/springer-empirical-$env:GITHUB_RUN_ID"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python scripts/build_papers_pc08.py --paper springer --output-dir $out --require-runner
          if ($LASTEXITCODE -ne 0) { throw 'New Springer PDF compilation failed' }
          $manifest = Get-Content -LiteralPath (Join-Path $out 'build_manifest.json') -Raw | ConvertFrom-Json
          if (@($manifest.results).Count -ne 1 -or $manifest.results[0].status -ne 'ok') {
            throw 'Build manifest does not contain a successful Springer PDF'
          }
          if ($manifest.source_commit -ne $env:GITHUB_SHA) { throw 'Build source SHA mismatch' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment011/pc08_empirical/inspect_pdf.py --pdf (Join-Path $out 'springer.pdf') --log paper/main.log --output (Join-Path $out 'proof')
          if ($LASTEXITCODE -ne 0) { throw 'Fresh PDF inspection failed' }
      - name: Upload newly compiled PDF and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: springer-empirical-pdf
          path: paper/builds/pc08/springer-empirical-*/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve verified new PDF on source and immutable artifacts branches
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "paper/builds/pc08/springer-empirical-$env:GITHUB_RUN_ID"
          $manifestPath = Join-Path $out 'build_manifest.json'
          $pdfPath = Join-Path $out 'springer.pdf'
          $inspectPath = Join-Path $out 'proof/pdf_inspection.json'
          if (-not ((Test-Path $manifestPath) -and (Test-Path $pdfPath) -and (Test-Path $inspectPath))) {
            throw 'Cannot publish without fresh PDF, manifest and PDF inspection'
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.results[0].status -ne 'ok') { throw 'New compile not successful' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $out paper/main.pdf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage PDF/provenance' }
          git commit -m 'paper: archive new Springer empirical PDF, TeX logs and page proof'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit PDF' }
          git push origin HEAD:refs/heads/paper/springer-empirical-tensor-pc08
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push source branch with PDF' }
          $branch = "artifacts/springer-empirical-pc08-$env:GITHUB_RUN_ID"
          git switch -c $branch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create immutable PDF branch' }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push immutable PDF branch' }
          Write-Host "Published new PDF SHA256=$($manifest.results[0].pdf_sha256)"


  publish_repaired_analysis:
    if: contains(github.event.head_commit.message, '[pc08-publish]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Require intended runner
        run: |
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong PC08 runner' }
      - uses: actions/download-artifact@v4
        with:
          name: experiment011-springer-analysis-42636962129
          run-id: 42636962129
          github-token: ${{ github.token }}
          path: paper/benchmarks/experiment011/pc08_empirical/derived/42636962129
      - name: Verify and archive repaired derived evidence without rerunning any experiment
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'paper/benchmarks/experiment011/pc08_empirical/derived/42636962129'
          $summary = Get-Content -LiteralPath (Join-Path $out 'analysis_summary.json') -Raw | ConvertFrom-Json
          if ($summary.recorded_jobs -ne 2813 -or $summary.valid_complete_rows -ne 76220) {
            throw 'Artifact summary does not match independent audit'
          }
          foreach ($file in @('figures/fig02_paired_cv_gcv.pdf',
            'empirical_results.tex','paired_backend_seed_bootstrap.csv','claim_to_data_ledger.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $out $file))) {
              throw "Missing required repaired artifact $file"
            }
          }
          $table = Get-Content -LiteralPath (Join-Path $out 'empirical_results.tex') -Raw
          if (-not $table.Contains('confirm-data')) { throw 'Repaired case-labeled table absent' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $out
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage audited files' }
          git commit -m 'experiment011: archive repaired evidence with case-specific forest plot'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit audited files' }
          $results = 'results/experiment011-springer-derived-42636962129'
          git push origin "HEAD:refs/heads/$results"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish immutable repaired result' }
          git push origin HEAD:refs/heads/paper/springer-empirical-tensor-pc08
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fast-forward source branch' }
          Write-Host 'Published repaired 21-file analysis artifact and permanent results branch'
