name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests benchmarks
      - name: Test
        run: python -m pytest -q

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install -e '.[dev,docs,plot]'
      - name: Validate notebook structure
        run: python -m pytest tests/test_notebook_gallery.py -q
      - name: Build HTML without executing expensive notebooks
        env:
          TRENDESTIMATION_DOCS_EXECUTION: "off"
        run: python -m sphinx -b html -W --keep-going docs build/site
