name: Lightweight documentation checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release package and documentation dependencies
        run: python -m pip install -e ".[dev,docs,plot]"
      - name: Run unit and notebook validity tests
        run: python -m pytest -q
      - name: Compile HTML without executing expensive notebooks
        env:
          TRENDESTIMATION_DOCS_EXECUTION: "off"
        run: python -m sphinx -b html -W --keep-going docs build/site
