name: Numerical QA (lightweight)

on:
  pull_request:
    paths:
      - "src/trendestimation/**"
      - "tests/test_numerical_validation.py"
      - ".github/workflows/numerical-qa.yml"
  push:
    branches:
      - "qa/numerical-verification-20261021"

permissions:
  contents: read

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Run independent numerical validation
        run: python -m pytest -q tests/test_numerical_validation.py
      - name: Run existing unit tests
        run: python -m pytest -q tests/test_core.py
