name: Paper C GCV spline validation on PCAG103A-08

on:
  push:
    branches: [research/paper-c-experiment001-d3-recurrence]
    paths:
      - .github/workflows/paper-c-gcv-spline-pc08.yml
      - paper/ngsim-jerk-case-study/experiments/experiment003/run.py
      - tests/test_paper_c_experiment003.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-c-gcv-spline-pc08
  cancel-in-progress: false

jobs:
  gcv-spline-pilot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      CONDA_ENV_DIR: 'C:\Users\175199\AppData\Local\miniconda3\envs\trendestimation'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Require exact trusted PC08 environment without installation
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong runner' }
          if (!(Test-Path -LiteralPath $env:CONDA_EXE)) { throw 'Missing existing conda' }
          if (!(Test-Path -LiteralPath (Join-Path $env:CONDA_ENV_DIR 'python.exe'))) { throw 'Missing existing Python environment' }
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -c "from scipy.interpolate import make_smoothing_spline; print('Training-only SciPy spline GCV supported')"
          if ($LASTEXITCODE -ne 0) { throw 'SciPy GCV smoothing spline unavailable' }

      - name: Test GCV baseline and archived recurrence parity
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_paper_c_experiment003.py
          if ($LASTEXITCODE -ne 0) { throw 'Spline GCV deterministic tests failed' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/ngsim-jerk-case-study/experiments/experiment001/run.py --verify
          if ($LASTEXITCODE -ne 0) { throw 'Existing PLS recurrence parity failed' }

      - name: Evaluate GCV-selected cubic smoothing splines on frozen positions
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src'
          $dir = "paper/ngsim-jerk-case-study/experiments/experiment003/runs/pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/ngsim-jerk-case-study/experiments/experiment003/run.py --output-dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Spline GCV experiment failed' }
          if (!(Test-Path (Join-Path $dir 'forecast_rows.json'))) { throw 'Incomplete forecast rows' }
          git rev-parse HEAD | Out-File -FilePath (Join-Path $dir 'source_commit.txt') -Encoding utf8
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze | Out-File -FilePath (Join-Path $dir 'requirements-resolved.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not capture environment versions' }
          Get-Content (Join-Path $dir 'RESULTS.md')

      - name: Publish artifact even if numerical execution fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-c-exp003-pc08-gcv-spline
          path: paper/ngsim-jerk-case-study/experiments/experiment003/runs/
          if-no-files-found: warn
          retention-days: 90

      - name: Permanently preserve successful output on results-only branch
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "paper/ngsim-jerk-case-study/experiments/experiment003/runs/pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          if (!(Test-Path (Join-Path $dir 'run_manifest.json'))) { throw 'Missing reproducibility manifest' }
          $archive = "results/paper-c-exp003-pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create results branch' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage results files' }
          git commit -m "experiment003: archive PC08 spline GCV $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit results' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push permanent results branch' }
          Write-Host "Archived outputs to $archive"
