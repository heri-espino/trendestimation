name: Experiment010 continue complete grid by request (Windows)

on:
  push:
    branches: [research/experiment010-comprehensive-grid]
    paths:
      - paper/benchmarks/experiment010/REQUEST_BATCH.json

permissions:
  contents: write
concurrency:
  group: experiment010-comprehensive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-requested-shard-window:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      PYTHONPATH: ${{ github.workspace }}\src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Read explicit request and verify stable resources
        run: |
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong runner' }
          if (!(Test-Path -LiteralPath $env:CONDA_EXE)) { throw 'Existing Conda missing' }
          $req = Get-Content -Raw paper/benchmarks/experiment010/REQUEST_BATCH.json | ConvertFrom-Json
          if ($req.enabled -ne $true) { throw 'Request must explicitly enable the numerical run' }
          $shard = [int]$req.shard_index
          $count = [int]$req.shard_count
          $offset = [int]$req.start_attempt
          $attempts = [int]$req.max_method_attempts
          if ($count -lt 1 -or $count -gt 64 -or $shard -lt 0 -or $shard -ge $count -or $offset -lt 0 -or $attempts -lt 1 -or $attempts -gt 40) { throw 'Invalid bounded request' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_experiment010_runner.py tests/test_experiment010_mle_normalization.py tests/test_experiment006_hybrid_criteria.py tests/test_experiment006_selected_inverse.py
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
      - name: Record actual complete-criterion measurements
        run: |
          $req = Get-Content -Raw paper/benchmarks/experiment010/REQUEST_BATCH.json | ConvertFrom-Json
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $shard = [int]$req.shard_index
          $count = [int]$req.shard_count
          $offset = [int]$req.start_attempt
          $attempts = [int]$req.max_method_attempts
          $dest = "paper/benchmarks/experiment010/runs/windows-$id-comprehensive-shard$shard-offset$offset"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment010/run_batches.py --preset comprehensive --manifest-scope shard --shard-index $shard --shard-count $count --start-attempt $offset --max-method-attempts $attempts --max-seconds 600 --per-method-seconds 25 --repeats 2 --series-count 2 --max-work 80000000 --output $dest
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark runner failed; partial evidence may exist' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze | Out-File "$dest/requirements-resolved.txt" -Encoding utf8
          Get-Content "$dest/batch_summary.json"
      - name: Upload raw records and status ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment010-request-${{ github.run_id }}-a${{ github.run_attempt }}
          path: paper/benchmarks/experiment010/runs/windows-${{ github.run_id }}-a${{ github.run_attempt }}-comprehensive-shard*/
          if-no-files-found: warn
      - name: Push immutable result branch
        if: always()
        run: |
          $req = Get-Content -Raw paper/benchmarks/experiment010/REQUEST_BATCH.json | ConvertFrom-Json
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $shard = [int]$req.shard_index
          $offset = [int]$req.start_attempt
          $dir = "paper/benchmarks/experiment010/runs/windows-$id-comprehensive-shard$shard-offset$offset"
          if (!(Test-Path -LiteralPath "$dir/run_metadata.json")) { exit 0 }
          $archive = "results/experiment010-$id-comprehensive-shard$shard-offset$offset"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create result branch' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage results' }
          git commit -m "experiment010: archive requested comprehensive shard $shard offset $offset ($id)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit results' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push results' }
