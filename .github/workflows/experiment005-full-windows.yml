name: Experiment005 full paired study — Windows workstation

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Paired benchmark size: full is publication candidate"
        required: true
        type: choice
        options:
          - quick
          - full
        default: full
      repeats:
        description: "Timing repetitions (>=1)"
        required: true
        type: number
        default: 7
      seed_offset:
        description: "Deterministic independent-seed offset"
        required: true
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: experiment005-windows-full
  cancel-in-progress: false

jobs:
  paired-windows:
    # Uses any authorized repository Windows x64 self-hosted runner;
    # PCAG103A-08 is the intended runner. It must be online and logged in.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify Windows Conda research environment and test contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:USERPROFILE 'AppData\Local\miniconda3\envs\trendestimation\python.exe'
          if (-not (Test-Path $python)) {
            throw "Expected trendestimation Conda Python not found at $python. Configure the runner account/environment before running."
          }
          & $python -m pip install -e ".[dev,plot]"
          if ($LASTEXITCODE -ne 0) { throw "Package installation failed" }
          & $python -m pip install "mpmath==1.3.0" threadpoolctl
          if ($LASTEXITCODE -ne 0) { throw "Numerical dependency installation failed" }
          & $python -m pip install -r paper/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "AwesomeFigures installation failed" }
          & $python -m pytest -q tests/test_experiment005_paired.py
          if ($LASTEXITCODE -ne 0) { throw "Smoke numerical checks failed" }
      - name: Run paired numerical precision and wall time on same workstation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:USERPROFILE 'AppData\Local\miniconda3\envs\trendestimation\python.exe'
          $folder = "paper/benchmarks/experiment005/runs/windows-${{ github.run_id }}"
          & $python paper/benchmarks/experiment005/run.py --preset "${{ inputs.preset }}" --repeats "${{ inputs.repeats }}" --digits 85 --seed-offset "${{ inputs.seed_offset }}" --out $folder
          if ($LASTEXITCODE -ne 0) { throw "Experiment005 failed" }
          $inputSha = (git rev-parse HEAD).Trim()
          Set-Content -Path (Join-Path $folder "input_commit.txt") -Value $inputSha -NoNewline
          & $python paper/benchmarks/experiment005/analyze.py --run $folder
          if ($LASTEXITCODE -ne 0) { throw "Pareto analysis failed" }
          $report = Get-Content (Join-Path $folder "summary.json") -Raw | ConvertFrom-Json
          if ($report.fit_rows -le 0 -or $report.selection_rows -le 0) { throw "Empty benchmark results" }
          Write-Host "Experiment005 completed. Fit rows=$($report.fit_rows); selection rows=$($report.selection_rows)"
      - name: Upload original full results, including invalid cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment005-windows-${{ github.run_id }}
          path: paper/benchmarks/experiment005/runs/windows-${{ github.run_id }}/
          if-no-files-found: warn
      - name: Push reproducible results to an independent branch
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $branch = "experiment005/windows-full-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c $branch
          if ($LASTEXITCODE -ne 0) { throw "Could not create results branch" }
          git add -f "paper/benchmarks/experiment005/runs/windows-${{ github.run_id }}/"
          if ($LASTEXITCODE -ne 0) { throw "Could not stage raw results" }
          git commit -m "experiment005: archive Windows paired accuracy-runtime ${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit raw results" }
          git push -u origin $branch
          if ($LASTEXITCODE -ne 0) { throw "Could not push results branch" }
          Write-Host "Preserved results on branch $branch. Open a PR for review; do not auto-merge."
