name: Experiment010 comprehensive grid (Windows)

on:
  push:
    branches: [research/experiment010-comprehensive-grid]
    paths: [.github/workflows/experiment010-comprehensive.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "Create the full planned manifest or run a bounded shard window"
        type: choice
        options: [plan, batch]
        default: batch
        required: true
      shard_index:
        description: "Zero-based selected shard for manual batch"
        type: number
        default: 0
        required: true
      shard_count:
        description: "Deterministic number of shards"
        type: number
        default: 16
        required: true
      start_attempt:
        description: "Within-shard cursor from previous batch_summary.json"
        type: number
        default: 0
        required: true

permissions:
  contents: write
concurrency:
  group: experiment010-comprehensive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-plan:
    if: github.event_name == 'push' || inputs.mode == 'plan'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      PYTHONPATH: ${{ github.workspace }}\src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and university Windows environment
        run: |
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong runner' }
          if (!(Test-Path $env:CONDA_EXE)) { throw 'Existing Conda not found' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_experiment010_runner.py tests/test_experiment010_mle_normalization.py tests/test_experiment006_selected_inverse.py
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
      - name: Generate the entire design; no actual solver timings
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $dest = "paper/benchmarks/experiment010/runs/windows-$id-comprehensive-plan"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment010/run_batches.py --preset comprehensive --plan-only --max-work 80000000 --repeats 2 --series-count 2 --output $dest
          if ($LASTEXITCODE -ne 0) { throw 'Full manifest generation failed' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze | Out-File "$dest/requirements-resolved.txt" -Encoding utf8
          Get-Content "$dest/batch_summary.json"
      - name: Upload complete design
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment010-complete-plan-${{ github.run_id }}-a${{ github.run_attempt }}
          path: paper/benchmarks/experiment010/runs/windows-${{ github.run_id }}-a${{ github.run_attempt }}-comprehensive-plan/
          if-no-files-found: warn
      - name: Preserve complete design in immutable Git branch
        if: always()
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $dir = "paper/benchmarks/experiment010/runs/windows-$id-comprehensive-plan"
          if (!(Test-Path "$dir/batch_summary.json")) { exit 0 }
          $archive = "results/experiment010-$id-comprehensive-plan"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create result branch' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage full manifest' }
          git commit -m "experiment010: archive all 403200 planned cells ($id)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit manifest' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push manifest' }

  measured-shards:
    if: github.event_name == 'push' || inputs.mode == 'batch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[0,1,2,3]' || format('[{0}]', inputs.shard_index)) }}
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      PYTHONPATH: ${{ github.workspace }}\src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Validate tests and existing university environment
        run: |
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Wrong runner' }
          if (!(Test-Path $env:CONDA_EXE)) { throw 'Existing Conda not found' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pytest -q tests/test_experiment010_runner.py tests/test_experiment010_mle_normalization.py tests/test_experiment006_hybrid_criteria.py tests/test_experiment006_selected_inverse.py
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed; no timings' }
      - name: Execute resource-bounded genuine comprehensive-grid cases
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $shard = '${{ matrix.shard }}'
          $count = if ('${{ github.event_name }}' -eq 'push') { 16 } else { '${{ inputs.shard_count }}' }
          $offset = if ('${{ github.event_name }}' -eq 'push') { 0 } else { '${{ inputs.start_attempt }}' }
          $dest = "paper/benchmarks/experiment010/runs/windows-$id-comprehensive-shard$shard-offset$offset"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/benchmarks/experiment010/run_batches.py --preset comprehensive --manifest-scope shard --shard-index $shard --shard-count $count --start-attempt $offset --max-method-attempts 40 --max-seconds 600 --per-method-seconds 25 --repeats 2 --series-count 2 --max-work 80000000 --output $dest
          if ($LASTEXITCODE -ne 0) { throw 'Batch failed; partial archive may exist' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python -m pip freeze | Out-File "$dest/requirements-resolved.txt" -Encoding utf8
          Get-Content "$dest/batch_summary.json"
      - name: Upload raw measurements and explicit exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment010-grid-shard${{ matrix.shard }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: paper/benchmarks/experiment010/runs/windows-${{ github.run_id }}-a${{ github.run_attempt }}-comprehensive-shard${{ matrix.shard }}-offset*/
          if-no-files-found: warn
      - name: Permanently preserve each bounded batch in GitHub
        if: always()
        run: |
          $id = "$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $shard = '${{ matrix.shard }}'
          $offset = if ('${{ github.event_name }}' -eq 'push') { 0 } else { '${{ inputs.start_attempt }}' }
          $dir = "paper/benchmarks/experiment010/runs/windows-$id-comprehensive-shard$shard-offset$offset"
          if (!(Test-Path "$dir/run_metadata.json")) { exit 0 }
          $archive = "results/experiment010-$id-comprehensive-shard$shard-offset$offset"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create result branch' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage raw evidence' }
          git commit -m "experiment010: comprehensive shard $shard offset $offset ($id)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit raw evidence' }
          git push origin "HEAD:refs/heads/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push raw evidence' }
