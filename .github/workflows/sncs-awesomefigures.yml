name: Regenerate SNCS figures with pinned AwesomeFigures

on:
  push:
    branches:
      - paper/awesomefigures-native-rerender-20261028
    paths:
      - "paper/computational-statistics-submission/*.py"
      - "tests/test_native_awesomefigures_paper.py"
      - ".github/workflows/sncs-awesomefigures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sncs-awesomefigures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-only-render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-pinned AwesomeFigures and paper dependencies
        run: |
          python -m pip install -e ".[dev,plot]"
          python -m pip install -r paper/requirements.txt
          python -c "import awesomefigures as af; print('Actual AwesomeFigures:', af.__version__)"
      - name: Verify AwesomeFigures public API and immutable source archive
        run: |
          python -m pytest -q tests/test_native_awesomefigures_paper.py tests/test_sncs_dashboard.py
      - name: Regenerate all SNCS figures from archived data only
        run: |
          python paper/computational-statistics-submission/rerender_awesomefigures.py --scope journal
      - name: Compile the Springer SN Computer Science manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/computational-statistics-submission
          root_file: sncs_main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Verify output PDF, cited figures, and unmodified numerical data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("paper/computational-statistics-submission")
          assert (p/"sncs_main.pdf").stat().st_size > 100_000
          m=json.loads((p/"awesomefigures_render_manifest.json").read_text())
          assert m["sources_unchanged"] and m["no_benchmarks_or_selectors_rerun"]
          assert m["awesomefigures"]["source_commit"] == "54c8bf2374551fa39428f47f69580b4822d4b938"
          assert all((p/"figures"/name).exists() for name in m["manuscript_referenced_figures"])
          assert len(m["figure_files"]) >= 100
          print("VERIFIED",len(m["figure_files"]),"figures; source SHA-256 unchanged")
          PY
      - name: Commit updated figures, figure manifests and compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/computational-statistics-submission/figures/
          git add -f paper/computational-statistics-submission/awesomefigures_render_manifest.json
          git add -f paper/computational-statistics-submission/figure_render_manifest.json
          git add -f paper/computational-statistics-submission/sncs_expanded_render_manifest.json
          git add -f paper/computational-statistics-submission/sncs_main.pdf
          if git diff --cached --quiet; then
            echo "All paper figures already match the frozen results and AwesomeFigures style."
          else
            git commit -m "paper: regenerate all SNCS figures with pinned AwesomeFigures"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sncs-awesomefigures-${{ github.run_id }}
          path: |
            paper/computational-statistics-submission/sncs_main.pdf
            paper/computational-statistics-submission/figures/
            paper/computational-statistics-submission/awesomefigures_render_manifest.json
          retention-days: 30
