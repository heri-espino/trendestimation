name: Paper C revised manuscript smoke on PCAG103A-08

on:
  push:
    branches: [research/paper-c-experiment001-d3-recurrence, paper/paper-c-methods-literature-audit]
    paths:
      - .github/workflows/paper-c-manuscript-pc08.yml
      - paper/ngsim-jerk-case-study/main.tex
      - paper/ngsim-jerk-case-study/sections/**
      - paper/ngsim-jerk-case-study/references.bib
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-c-manuscript-pc08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-ngsim:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      CONDA_EXE: 'C:\Users\175199\AppData\Local\miniconda3\Scripts\conda.exe'
      CONDA_ENV_DIR: 'C:\Users\175199\AppData\Local\miniconda3\envs\trendestimation'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Require designated Windows runner and existing Conda TeX build
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-08') { throw 'Unexpected runner' }
          if (!(Test-Path $env:CONDA_EXE)) { throw 'Existing Conda installation missing' }
          if (!(Test-Path (Join-Path $env:CONDA_ENV_DIR 'python.exe'))) { throw 'Existing Python environment missing' }
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python scripts/build_papers_pc08.py --list
          if ($LASTEXITCODE -ne 0) { throw 'Publication source preflight failed' }

      - name: Compile revised NGSIM paper using existing figures and bibliography
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "paper/builds/pc08-paper-c-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python scripts/build_papers_pc08.py --paper ngsim --output-dir $dir --require-runner
          if ($LASTEXITCODE -ne 0) { throw 'Revised NGSIM manuscript failed to compile' }
          if (!(Test-Path (Join-Path $dir 'build_manifest.json'))) { throw 'Missing build manifest' }
          Get-Content (Join-Path $dir 'build_manifest.json')
      
      - name: Audit compiled manuscript against frozen AwesomeFigures records
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "paper/builds/pc08-paper-c-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $p = 'paper/ngsim-jerk-case-study'
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python "$p/visuals/audit_awesomefigures_atlas.py" --atlas "$p/generated/awesomefigures_atlas_manifest.json" --figures "$p/figures" --paper "$p/main.pdf" --supplement "$p/atlas_supplement.pdf" --report (Join-Path $dir 'atlas_audit.json')
          if ($LASTEXITCODE -ne 0) { throw 'Paper C frozen-asset/manuscript audit failed' }

      - name: Rasterize revised paper pages for complete visual review
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "paper/builds/pc08-paper-c-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          & $env:CONDA_EXE run --no-capture-output -n trendestimation python paper/ngsim-jerk-case-study/visuals/render_pdf_pages.py --pdf paper/ngsim-jerk-case-study/main.pdf --output-dir (Join-Path $dir 'page-previews') --dpi 144 --columns 3
          if ($LASTEXITCODE -ne 0) { throw 'Paper C PDF page rendering failed' }

      - name: Publish source-matched PDF exclusively to the scoped literature branch
        if: success() && github.ref_name == 'paper/paper-c-methods-literature-audit'
        run: |
          $ErrorActionPreference = 'Stop'
          # Never overwrite a branch changed by a concurrent agent.
          git fetch origin "refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check remote publication branch' }
          $remote = (git rev-parse FETCH_HEAD).Trim()
          if ($remote -ne $env:GITHUB_SHA) { throw "Source SHA changed; refusing PDF publication ($remote)" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- paper/ngsim-jerk-case-study/main.pdf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage paper PDF' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "paper-c: compile DOI-verified methods citation revision on PC08"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot commit compiled paper' }
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish source-matched paper PDF' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Cannot check staged publication difference'
          }

      - name: Publish build manifest, PDF and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-c-revised-manuscript-pc08
          path: |
            paper/builds/pc08-paper-c-*/
            paper/ngsim-jerk-case-study/main.pdf
          if-no-files-found: warn
          retention-days: 90

      - name: Archive compiled PDF and reproducibility metadata in separate results branch
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "paper/builds/pc08-paper-c-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $branch = "results/paper-c-pdf-pc08-$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create artifact branch' }
          git add -f -- $dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage manuscript build' }
          if (Test-Path 'paper/ngsim-jerk-case-study/main.pdf') {
            git add -f -- 'paper/ngsim-jerk-case-study/main.pdf'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stage revised manuscript PDF' }
          }
          git commit -m "paper-c: archive revised compiled manuscript PC08 $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit build' }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push build artifact branch' }
          Write-Host "Saved paper PDF and logs in $branch"
