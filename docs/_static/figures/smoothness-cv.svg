<title id="cv-title">Classical leave-one-out error by normalized smoothness</title>
<desc id="cv-desc">Scores for 60 synthetic observations, finite difference order two and fixed reference mean zero. CV MSE decreases to about 0.109 at smoothness 0.90 and increases again towards smoothness one. Highlighted smoothness candidates are 0.15, 0.35, 0.55, 0.75, and 0.90.</desc>
